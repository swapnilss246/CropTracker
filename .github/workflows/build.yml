name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # NEW: Tells GitHub to fetch the commit history so we can read it

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Generate changes.txt
      run: |
        echo "Recent Updates to CropTracker:" > changes.txt
        echo "------------------------------" >> changes.txt
        # Gets the last 5 commit messages and puts them in the text file
        git log -5 --pretty=format:"- %s (%cr)" >> changes.txt 

    - name: Upload APK and Changelog
      uses: actions/upload-artifact@v4
      with:
        name: CropTracker-APK
        path: |
          app/build/outputs/apk/debug/app-debug.apk
          changes.txt